# Literal KEY=value. No quotes, shell expansion, inline comments, or passwords.
SAP_SID=PRD
DB_UNIQUE_NAME=PRD
MEMBER1_DIR=/oracle/PRD/origlogA
MEMBER2_DIR=/oracle/PRD/mirrlogA
DAYS=3
WINDOW=whole
# For WINDOW=custom, use HH24:MI; an END_TIME of 24:00 is supported.
START_TIME=00:00
END_TIME=24:00
# 60 minutes and 150% preserve the original peak * 1.5 sizing intent.
TARGET_SWITCH_MINUTES=60
HEADROOM_PERCENT=150
MIN_SIZE_MB=100
MAX_SIZE_MB=8192
# 0 means automatic sizing. A positive integer is a deliberate override.
SIZE_MB=0
# replace: final group count; 0 preserves current count, with minimum 3.
# add: number of groups to add; must be between 1 and 32.
OPERATION=replace
TARGET_GROUP_COUNT=0
# Optional explicit IDs. Must match the number to create and be unused.
NEW_GROUPS=
RESERVE_MB=1024
WAIT_SECONDS=600
POLL_SECONDS=5
MAX_SWITCHES=32
MAX_RUNTIME_SECONDS=1800
PLAN_MAX_AGE_HOURS=24
